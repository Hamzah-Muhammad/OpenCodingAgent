[project]
name = "opencodingagent"
version = "0.1.1"
description = "A free coding agent for your terminal, running entirely on free LLM APIs"
requires-python = ">=3.10"
dependencies = ["openai", "rich", "python-dotenv"]

[project.scripts]
opencodingagent = "open_coding_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["open_coding_agent*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
